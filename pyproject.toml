[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinicaliq"
version = "0.1.0"
description = "FHIR-native clinical outcomes analytics platform for quality measures and care gaps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "loguru>=0.7",
]

[project.optional-dependencies]
app = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "streamlit>=1.36",
  "pandas>=2.2",
]
fhir = [
  "fhir.resources>=8.0",
]
nlp = [
  "spacy>=3.7",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "black>=24",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true

