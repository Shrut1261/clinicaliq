services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinicaliq
      POSTGRES_PASSWORD: clinicaliq
      POSTGRES_DB: clinicaliq
    ports:
      - "5434:5432"
    volumes:
      - clinicaliq_postgres:/var/lib/postgresql/data
      - ./infra/sql:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"

volumes:
  clinicaliq_postgres:

